# Local PostgreSQL for development only. Not used in production —
# Render/Railway provide managed Postgres there.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jorjek
      POSTGRES_PASSWORD: jorjek_dev
      POSTGRES_DB: jorjek
    ports:
      - "5432:5432"
    volumes:
      - jorjek_pg_data:/var/lib/postgresql/data

volumes:
  jorjek_pg_data:
