services:
  - type: web
    name: ngep-jorjek-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTIFICATION_TRANSPORT
        value: websocket
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # HTTPS email API (port 443 — allowed on Render free tier).
      # If RESEND_API_KEY is set, the app uses Resend and ignores SMTP.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
    plan: free
